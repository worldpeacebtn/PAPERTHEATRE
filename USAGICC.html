<!DOCTYPE html>
<html lang="en" class="dark" data-theme="quantum">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Utopia: 3D Universe Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        quantum: { 50: '#fdf4f8', 500: '#ec4899', 900: '#831843' },
                        universe: { 500: '#6366f1', 900: '#312e81' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; background: #000; touch-action: none; user-select: none; }
        .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
        
        /* The crucial absolute full-screen canvas */
        #canvas-container { position: absolute; inset: 0; z-index: 0; width: 100vw; height: 100vh; }
        
        /* UI Layer stays on top, passes clicks through empty space */
        #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Glassy UI Elements */
        .glass-panel { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-purple { background: rgba(88, 28, 135, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(236, 72, 153, 0.4); }
        
        /* Expandable Menus */
        .expandable-menu { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; }
        .emoji-btn { transition: transform 0.2s, box-shadow 0.2s; }
        .emoji-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(236, 72, 153, 0.6); }

        /* Custom Scrollbar for inner menus */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 2px; }

        /* Novel Dialogue Box Animation */
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .novel-box-anim { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="text-slate-100">

    <div id="canvas-container"></div>

    <!-- UI LAYER: Everything inside must have pointer-events-auto if interactive -->
    <div id="ui-layer">
        
        <header class="pointer-events-auto p-3 flex justify-between items-start w-full pointer-events-none">
            <div class="glass-purple p-2.5 rounded-2xl shadow-2xl flex items-center gap-3 pointer-events-auto w-full max-w-2xl mx-auto backdrop-blur-xl">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-pink-500 to-cyan-500 flex items-center justify-center text-xl shadow-[0_0_15px_rgba(236,72,153,0.5)]">
                    ✨
                </div>
                <div class="flex-1">
                    <h1 class="font-mono-tech font-bold text-xs sm:text-sm text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-cyan-300">QUANTUM UTOPIA: 3D UNIVERSE</h1>
                    <div class="flex gap-3 text-[10px] font-mono text-pink-200 mt-0.5">
                        <span>LVL <strong id="hud-lvl">1</strong></span>
                        <span>EXP <strong id="hud-exp">0</strong>/100</span>
                        <span>SCENE: <strong class="text-cyan-300">Active</strong></span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <select id="cam-perspective" onchange="changeCameraPerspective(this.value)" class="bg-slate-900 border border-pink-500/50 text-pink-300 font-mono text-[10px] rounded-lg px-2 py-1 outline-none">
                        <option value="orbit">📷 360 Orbit</option>
                        <option value="novel">💬 Novel Cam</option>
                        <option value="action">⚡ Action</option>
                    </select>
                    <label class="cursor-pointer bg-slate-900 hover:bg-slate-800 border border-cyan-500/50 text-cyan-300 font-mono text-[10px] rounded-lg px-2 py-1 transition flex items-center gap-1">
                        🌌 Skybox
                        <input type="file" accept="image/*" class="hidden" onchange="uploadSkybox(event)">
                    </label>
                </div>
            </div>
        </header>

        <div class="flex-1 flex justify-between items-center w-full px-2 pointer-events-none">
            
            <!-- LEFT: Emoji App Dock (Expandable to panels) -->
            <aside class="pointer-events-auto flex flex-col gap-3 group relative z-20">
                <div class="glass-purple p-2 rounded-2xl flex flex-col gap-2 shadow-2xl backdrop-blur-xl">
                    <button onclick="togglePanel('roster-panel')" class="emoji-btn w-12 h-12 rounded-xl bg-pink-500/20 border border-pink-500/50 text-2xl flex items-center justify-center" title="Paperdolls & Characters">🐰</button>
                    <button onclick="togglePanel('vroid-panel')" class="emoji-btn w-12 h-12 rounded-xl bg-purple-500/20 border border-purple-500/50 text-2xl flex items-center justify-center" title="VROID Neon Dolls">🪽</button>
                    <button onclick="togglePanel('video-panel')" class="emoji-btn w-12 h-12 rounded-xl bg-cyan-500/20 border border-cyan-500/50 text-2xl flex items-center justify-center" title="Video & Media Screen">🎬</button>
                    <button onclick="togglePanel('furniture-panel')" class="emoji-btn w-12 h-12 rounded-xl bg-indigo-500/20 border border-indigo-500/50 text-2xl flex items-center justify-center" title="3D Furniture Spawn">🔮</button>
                </div>

                <!-- Hidden Left Panels -->
                <div id="roster-panel" class="absolute left-16 top-0 w-64 glass-panel rounded-2xl p-4 hidden shadow-2xl border border-pink-500/30 max-h-[60vh] overflow-y-auto">
                    <h3 class="font-bold text-pink-400 font-mono text-xs mb-3 border-b border-slate-700 pb-2">🐰 Paperdoll Roster</h3>
                    <label class="block text-[10px] text-slate-400 mb-1">Create from Image (e.g. IMG_6481_216bdf.jpg)</label>
                    <input type="file" accept="image/*" onchange="createPaperdollFromImage(event)" class="w-full text-[10px] file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-pink-600 file:text-white mb-3">
                    <div id="character-list" class="space-y-2"></div>
                </div>

                <div id="furniture-panel" class="absolute left-16 top-0 w-64 glass-panel rounded-2xl p-4 hidden shadow-2xl border border-indigo-500/30">
                    <h3 class="font-bold text-indigo-400 font-mono text-xs mb-3 border-b border-slate-700 pb-2">🔮 Glassy Furniture</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="spawnGlassyObject('box')" class="p-2 bg-slate-900 rounded border border-indigo-500/50 text-[10px] hover:bg-indigo-900">Cube</button>
                        <button onclick="spawnGlassyObject('sphere')" class="p-2 bg-slate-900 rounded border border-indigo-500/50 text-[10px] hover:bg-indigo-900">Sphere</button>
                    </div>
                </div>
            </aside>

            <!-- RIGHT: Werkzeuge (Tools) -->
            <aside class="pointer-events-auto flex flex-col gap-3 group relative z-20">
                <div class="glass-purple p-2 rounded-2xl flex flex-col gap-2 shadow-2xl backdrop-blur-xl">
                    <button onclick="setToolMode('orbit')" id="tool-orbit" class="w-10 h-10 rounded-xl bg-pink-500 border border-pink-400 text-lg flex items-center justify-center transition" title="Camera Orbit">🎥</button>
                    <button onclick="setToolMode('interact')" id="tool-interact" class="w-10 h-10 rounded-xl bg-slate-800/80 border border-slate-600 text-lg flex items-center justify-center transition" title="Add Interaction Point">📌</button>
                    <button onclick="setToolMode('move')" id="tool-move" class="w-10 h-10 rounded-xl bg-slate-800/80 border border-slate-600 text-lg flex items-center justify-center transition" title="Move Object">✋</button>
                </div>
                
                <!-- Tool Context Menu -->
                <div id="tool-context" class="absolute right-14 top-0 w-48 glass-panel rounded-xl p-3 shadow-2xl border border-cyan-500/30 font-mono text-[10px] text-cyan-200">
                    Active Tool: <strong id="active-tool-display" class="text-pink-400">Camera Orbit</strong><br>
                    <span class="text-slate-400 mt-1 block">Drag space to rotate camera.</span>
                </div>
            </aside>

        </div>

        <footer class="pointer-events-none p-3 w-full flex flex-col items-center justify-end z-30">
            
            <!-- Visual Novel Dialogue Box (Hidden by default) -->
            <div id="novel-dialogue-ui" class="pointer-events-auto w-full max-w-3xl glass-purple border-t-2 border-pink-500 rounded-t-3xl p-6 hidden novel-box-anim mb-4 relative overflow-hidden shadow-[0_-10px_30px_rgba(236,72,153,0.3)]">
                <div class="absolute inset-0 bg-gradient-to-r from-pink-500/10 to-indigo-500/10 mix-blend-overlay pointer-events-none"></div>
                <div class="flex gap-6 items-start relative z-10">
                    <div id="novel-portrait" class="w-24 h-24 rounded-full border-2 border-pink-400 bg-slate-900 flex items-center justify-center text-4xl shadow-lg shrink-0">🐰</div>
                    <div class="flex-1">
                        <h2 id="novel-name" class="font-bold text-lg text-pink-300 font-mono-tech mb-2">Character Name</h2>
                        <p id="novel-text" class="text-sm text-slate-100 leading-relaxed min-h-[60px]">Dialogue text goes here...</p>
                        <div class="mt-4 flex gap-2">
                            <button onclick="nextNovelLine()" class="px-4 py-1.5 bg-pink-600 hover:bg-pink-500 rounded-lg text-xs font-bold text-white transition">Next ▶</button>
                            <button onclick="exitNovelMode()" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-300 transition">Exit</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Dock: Timeline & Export -->
            <div class="pointer-events-auto glass-panel w-full max-w-4xl p-2.5 rounded-2xl shadow-2xl flex items-center gap-4 backdrop-blur-xl border border-slate-700/50">
                <button onclick="togglePlay()" id="play-btn" class="w-10 h-10 rounded-xl bg-gradient-to-r from-pink-500 to-purple-500 text-white flex items-center justify-center shadow-lg hover:scale-105 transition">
                    ▶️
                </button>
                <div class="flex-1 flex flex-col font-mono text-[10px]">
                    <div class="flex justify-between text-slate-400 mb-1">
                        <span>Timeline Frame <span id="frame-count" class="text-cyan-300">0</span></span>
                        <span>Animation Tracks</span>
                    </div>
                    <input type="range" id="timeline-slider" min="0" max="1000" value="0" class="w-full accent-pink-500 h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                </div>
                <button onclick="exportDVDHTML()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs font-mono font-bold text-cyan-300 transition flex items-center gap-2">
                    💾 Export DVD Menu
                </button>
            </div>
        </footer>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="absolute top-20 right-4 z-50 pointer-events-none flex flex-col gap-2"></div>

    <script>
        let scene, camera, renderer, orbitControls;
        let objects3D = []; // Characters, Furniture, Videos
        let activeTool = 'orbit'; // orbit, interact, move
        let selectedObject = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        
        // Novel / Cinematic Mode
        let isNovelMode = false;
        let originalCamPos = new THREE.Vector3();
        let targetCamPos = new THREE.Vector3();
        let originalTarget = new THREE.Vector3();
        let targetLookAt = new THREE.Vector3();
        let activeDialogueIndex = 0;
        let currentDialogues = [];

        // App Data
        let appData = {
            level: 1,
            exp: 0,
            frame: 0,
            isPlaying: false
        };

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.02);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 12);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Orbit Controls (The key to camera angle in every direction)
            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.05;
            orbitControls.maxPolarAngle = Math.PI; // Allow full rotation
            orbitControls.target.set(0, 1.5, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 15, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const pinkLight = new THREE.PointLight(0xec4899, 2, 20);
            pinkLight.position.set(-5, 5, 0);
            scene.add(pinkLight);
            
            const cyanLight = new THREE.PointLight(0x06b6d4, 2, 20);
            cyanLight.position.set(5, 5, 0);
            scene.add(cyanLight);

            // Universe Grid Floor
            const gridHelper = new THREE.GridHelper(40, 40, 0xec4899, 0x1e1b4b);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            // Starfield
            createStarfield();

            // Default Characters
            spawnDefaultPaperdoll();

            // Events
            window.addEventListener('resize', onWindowResize);
            
            // Handle Interaction Raycasting
            renderer.domElement.addEventListener('pointerdown', onPointerDown);

            animate();
            updateUI();
        }

        function createStarfield() {
            const starGeo = new THREE.BufferGeometry();
            const starsCount = 2000;
            const posArray = new Float32Array(starsCount * 3);
            for(let i = 0; i < starsCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 80;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMat = new THREE.PointsMaterial({ size: 0.1, color: 0x8b5cf6, transparent: true, opacity: 0.8 });
            const starMesh = new THREE.Points(starGeo, starMat);
            scene.add(starMesh);
        }

        function spawnDefaultPaperdoll() {
            createPaperdollMesh("Quantum Bunny", 0, 0, "🐰");
        }

        function createPaperdollMesh(name, x, z, emoji, customImgUrl = null) {
            const group = new THREE.Group();
            group.position.set(x, 1.5, z);
            group.userData = { type: 'character', name: name, hp: 100, isPaperdoll: true, dialogue: [`Hello from ${name}!`, "Welcome to the Quantum Stage!"] };

            // Base Plane for Paperdoll
            const geometry = new THREE.PlaneGeometry(2.5, 3.5);
            let material;

            if (customImgUrl) {
                const texture = new THREE.TextureLoader().load(customImgUrl);
                material = new THREE.MeshStandardMaterial({ map: texture, transparent: true, side: THREE.DoubleSide, roughness: 0.2 });
            } else {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 356;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ec4899';
                ctx.roundRect(10, 10, 236, 336, 20);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px Inter'; ctx.textAlign = 'center';
                ctx.fillText(name, 128, 60);
                ctx.font = '80px sans-serif'; ctx.fillText(emoji, 128, 190);
                
                const texture = new THREE.CanvasTexture(canvas);
                material = new THREE.MeshStandardMaterial({ map: texture, transparent: true, side: THREE.DoubleSide, roughness: 0.2 });
            }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            group.add(mesh);

            // Floating Aura Ring
            const ringGeo = new THREE.TorusGeometry(1.5, 0.05, 16, 50);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = -1.5;
            group.add(ring);

            scene.add(group);
            objects3D.push(group);
            
            updateCharacterListUI();
            showToast(`Spawned Paperdoll: ${name}`);
        }

        function spawnGlassyObject(type) {
            const group = new THREE.Group();
            group.position.set((Math.random()-0.5)*5, 1, (Math.random()-0.5)*5);
            group.userData = { type: 'furniture', name: `Glassy ${type}` };

            let geometry;
            if(type === 'box') geometry = new THREE.BoxGeometry(2, 2, 2);
            else geometry = new THREE.SphereGeometry(1.2, 32, 32);

            // Maximum Quantum Utopia Glass Effect
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x8b5cf6, metalness: 0.1, roughness: 0.1,
                transmission: 0.9, opacity: 1, transparent: true,
                thickness: 0.5, clearcoat: 1.0, clearcoatRoughness: 0.1
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);
            scene.add(group);
            objects3D.push(group);
            showToast(`Spawned Glassy ${type}`);
        }

        function setToolMode(mode) {
            activeTool = mode;
            orbitControls.enabled = (mode === 'orbit');
            
            // Update UI
            ['orbit', 'interact', 'move'].forEach(t => {
                document.getElementById(`tool-${t}`).className = `w-10 h-10 rounded-xl text-lg flex items-center justify-center transition ` + 
                    (activeTool === t ? 'bg-pink-500 border-2 border-white' : 'bg-slate-800/80 border border-slate-600');
            });
            
            const toolDesc = {
                'orbit': 'Drag space to rotate camera.',
                'interact': 'Click on surfaces to add interaction anchor points.',
                'move': 'Click & drag objects to move them.'
            };
            document.getElementById('tool-context').innerHTML = `Active Tool: <strong class="text-pink-400">${mode.toUpperCase()}</strong><br><span class="text-slate-400 mt-1 block">${toolDesc[mode]}</span>`;
        }

        function onPointerDown(event) {
            if(activeTool === 'orbit') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            // Only intersect meshes within our objects3D groups
            let interactableMeshes = [];
            objects3D.forEach(grp => {
                grp.children.forEach(child => { if(child.isMesh) interactableMeshes.push(child); });
            });

            const intersects = raycaster.intersectObjects(interactableMeshes);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const parentGroup = hit.object.parent;

                if (activeTool === 'interact') {
                    // Add Interaction Point (Sphere) on the outside face
                    const pointGeo = new THREE.SphereGeometry(0.15, 16, 16);
                    const pointMat = new THREE.MeshBasicMaterial({ color: 0xec4899 });
                    const pointMesh = new THREE.Mesh(pointGeo, pointMat);
                    pointMesh.position.copy(hit.point);
                    // Attach to the object's parent group so it moves with it
                    parentGroup.worldToLocal(pointMesh.position);
                    parentGroup.add(pointMesh);
                    showToast("Interaction anchor placed!");
                    
                    if(parentGroup.userData.type === 'character' && !isNovelMode) {
                        enterNovelMode(parentGroup);
                    }
                } 
                else if (activeTool === 'move') {
                    selectedObject = parentGroup;
                    showToast(`Selected ${parentGroup.userData.name}`);
                    // Basic move logic would require pointerMove event binding, skipping complex drag math for brevity, 
                    // shifting position slightly on click for demo.
                    parentGroup.position.y += 0.5; 
                    setTimeout(() => parentGroup.position.y -= 0.5, 200);
                }
            }
        }

        function enterNovelMode(characterGroup) {
            if(isNovelMode) return;
            isNovelMode = true;
            orbitControls.enabled = false;

            // Save state
            originalCamPos.copy(camera.position);
            originalTarget.copy(orbitControls.target);

            // Calculate Target Camera Position (Close up on upper body)
            const charPos = characterGroup.position;
            targetCamPos.set(charPos.x, charPos.y + 0.5, charPos.z + 3.5);
            targetLookAt.copy(charPos).setY(charPos.y + 1.0);

            // UI Reveal
            document.getElementById('novel-dialogue-ui').classList.remove('hidden');
            document.getElementById('novel-name').innerText = characterGroup.userData.name;
            
            // Audio Sync
            if(Tone && Tone.context.state === 'running') {
                const synth = new Tone.Synth().toDestination();
                synth.triggerAttackRelease("C5", "8n");
            }

            currentDialogues = characterGroup.userData.dialogue || ["..."];
            activeDialogueIndex = 0;
            document.getElementById('novel-text').innerText = currentDialogues[activeDialogueIndex];
        }

        function nextNovelLine() {
            activeDialogueIndex++;
            if(activeDialogueIndex >= currentDialogues.length) {
                exitNovelMode();
            } else {
                document.getElementById('novel-text').innerText = currentDialogues[activeDialogueIndex];
                if(Tone) new Tone.Synth().toDestination().triggerAttackRelease("E5", "16n");
            }
        }

        function exitNovelMode() {
            document.getElementById('novel-dialogue-ui').classList.add('hidden');
            isNovelMode = false;
            // Restore orbit controls
            if(activeTool === 'orbit') orbitControls.enabled = true;
            targetCamPos.copy(originalCamPos);
            targetLookAt.copy(originalTarget);
        }

        function changeCameraPerspective(val) {
            if(val === 'novel') {
                if(objects3D.length > 0) enterNovelMode(objects3D[0]);
            } else if (val === 'action') {
                camera.position.set(10, 2, 5);
                orbitControls.target.set(0,0,0);
            } else {
                camera.position.set(0, 4, 12);
                orbitControls.target.set(0, 1.5, 0);
            }
        }

        function uploadSkybox(event) {
            const file = event.target.files[0];
            if(!file) return;
            const url = URL.createObjectURL(file);
            const loader = new THREE.TextureLoader();
            loader.load(url, (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping; // 360 Sphere bending
                scene.background = texture;
                scene.environment = texture;
                showToast("360° Skybox Applied! 🌌");
            });
        }

        function createPaperdollFromImage(event) {
            const file = event.target.files[0];
            if(!file) return;
            const url = URL.createObjectURL(file);
            createPaperdollMesh(`Custom Doll ${objects3D.length}`, (Math.random()-0.5)*4, (Math.random()-0.5)*2, "", url);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Orbit Update
            if(!isNovelMode && orbitControls.enabled) orbitControls.update();

            // Novel Camera Tweening
            if(isNovelMode) {
                camera.position.lerp(targetCamPos, 0.05);
                orbitControls.target.lerp(targetLookAt, 0.05);
                camera.lookAt(orbitControls.target);
            } else if (camera.position.distanceTo(targetCamPos) > 0.1 && targetCamPos.lengthSq() > 0 && !isNovelMode) {
                 // Tweening back to original
                 camera.position.lerp(originalCamPos, 0.08);
                 orbitControls.target.lerp(originalTarget, 0.08);
                 camera.lookAt(orbitControls.target);
            }

            // Paperdoll Billboarding (Crucial for 2D sprites in 3D) & Swaying
            const time = Date.now() * 0.003;
            objects3D.forEach((grp, i) => {
                if(grp.userData.isPaperdoll) {
                    // Turn towards user interface (camera) ALWAYS
                    grp.quaternion.copy(camera.quaternion);
                    
                    // Sway physics
                    grp.position.y = 1.5 + Math.sin(time + i) * 0.1;
                    grp.rotation.z += Math.sin(time * 2 + i) * 0.02; 
                }
            });

            // Timeline scrubbing simulation
            if(appData.isPlaying) {
                appData.frame = (appData.frame + 1) % 1000;
                document.getElementById('timeline-slider').value = appData.frame;
                document.getElementById('frame-count').innerText = appData.frame;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            panel.classList.toggle('hidden');
        }

        function togglePlay() {
            appData.isPlaying = !appData.isPlaying;
            document.getElementById('play-btn').innerText = appData.isPlaying ? "⏸️" : "▶️";
        }

        function updateUI() {
            document.getElementById('hud-lvl').innerText = appData.level;
            document.getElementById('hud-exp').innerText = appData.exp;
        }

        function updateCharacterListUI() {
            const list = document.getElementById('character-list');
            list.innerHTML = '';
            objects3D.filter(o => o.userData.type === 'character').forEach((char, i) => {
                list.innerHTML += `<div class="p-2 bg-slate-900 border border-slate-700 rounded text-[10px] text-pink-200 cursor-pointer hover:border-pink-500 transition" onclick="enterNovelMode(objects3D[${i}])">${char.userData.name} (Click to Talk)</div>`;
            });
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "bg-slate-900/90 border border-pink-500/50 text-white px-4 py-2 rounded-lg shadow-lg text-xs font-mono transform transition-all translate-x-10 opacity-0";
            toast.innerHTML = msg;
            container.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('translate-x-10', 'opacity-0'); }, 10);
            setTimeout(() => { 
                toast.classList.add('opacity-0'); 
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
