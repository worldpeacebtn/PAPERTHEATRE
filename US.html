<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Paper Theatre Studio PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        quantum: { 50: '#fdf4f8', 500: '#ec4899', 900: '#831843' },
                        theatre: { 500: '#8b5cf6', 900: '#2e1065' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- Three.js and essential loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <!-- Tone.js for Audio Synths -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; background: #020617; touch-action: none; user-select: none; }
        .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
        
        #canvas-container { position: absolute; inset: 0; z-index: 0; width: 100vw; height: 100vh; }
        #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
        .pointer-events-auto { pointer-events: auto; }
        
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-top: 1px solid rgba(236, 72, 153, 0.5); }
        .glass-purple { background: rgba(30, 15, 50, 0.75); backdrop-filter: blur(24px); border: 1px solid rgba(139, 92, 246, 0.4); }
        
        .futuristic-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-transform: uppercase; letter-spacing: 1px; }
        .futuristic-btn:active { transform: scale(0.95); }
        .futuristic-btn.active-tab { background: rgba(236, 72, 153, 0.25); border-bottom: 2px solid #ec4899; color: #fbcfe8; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 2px; }

        .dock-drawer { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s; transform: translateY(100%); opacity: 0; }
        .dock-drawer.open { transform: translateY(0); opacity: 1; }

        input[type=range] { appearance: none; background: rgba(255,255,255,0.1); height: 4px; border-radius: 2px; outline: none; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ec4899; box-shadow: 0 0 10px #ec4899; cursor: pointer; }

        #dom-anchors-container { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .dom-card {
            position: absolute; pointer-events: auto; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid #06b6d4;
            border-radius: 12px; padding: 16px; color: #fff; width: 280px; max-height: 350px;
            overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(6, 182, 212, 0.3);
            font-size: 12px; transform-origin: center center; will-change: transform;
            transition: opacity 0.2s;
        }

        #joystick-zone {
            position: absolute; bottom: 90px; right: 20px; width: 110px; height: 110px;
            background: radial-gradient(circle, rgba(236,72,153,0.15) 0%, rgba(0,0,0,0.5) 100%);
            border: 2px solid rgba(236,72,153,0.3); border-radius: 50%;
            pointer-events: auto; touch-action: none; display: flex; justify-content: center; align-items: center; z-index: 20;
            box-shadow: inset 0 0 20px rgba(236,72,153,0.2);
        }
        #joystick-knob {
            width: 36px; height: 36px; background: radial-gradient(circle at 30% 30%, #fbcfe8, #ec4899);
            border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 -3px 5px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        @keyframes rainbowGlow {
            0% { box-shadow: 0 0 15px #ff0055; border-color: #ff0055; }
            33% { box-shadow: 0 0 15px #00ffff; border-color: #00ffff; }
            66% { box-shadow: 0 0 15px #00ff66; border-color: #00ff66; }
            100% { box-shadow: 0 0 15px #ff0055; border-color: #ff0055; }
        }
        .audio-reactive-ui { animation: rainbowGlow 2s linear infinite; }
        
        .theatre-stage-frame {
            position: absolute; inset: 20px; border: 2px solid rgba(139, 92, 246, 0.3);
            pointer-events: none; border-radius: 20px; box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="text-slate-100" onload="initQuantumTheatre()">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>
    <div class="theatre-stage-frame"></div>
    
    <!-- DOM Cards (Scrollable HTML/TXT) -->
    <div id="dom-anchors-container"></div>

    <!-- UI Layer -->
    <div id="ui-layer">
        
        <!-- Top Header Status Bar -->
        <header class="pointer-events-auto p-4 flex justify-between items-start w-full pointer-events-none">
            <div class="glass-purple p-2.5 rounded-2xl shadow-2xl flex items-center gap-3 pointer-events-auto w-full max-w-xl mx-auto">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-pink-500 to-indigo-500 flex items-center justify-center text-lg shadow-[0_0_15px_rgba(236,72,153,0.5)]">🎭</div>
                <div class="flex-1">
                    <h1 class="font-mono-tech font-bold text-xs sm:text-sm text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-cyan-300">PAPER THEATRE & QUANTUM UTOPIA</h1>
                    <div class="flex gap-3 text-[10px] font-mono text-pink-200 mt-0.5">
                        <span id="audio-status">Audio: <strong class="text-slate-400">Off</strong></span>
                        <span>Orbit: <strong class="text-cyan-300">Free 360°</strong></span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Tool Overlay (Left) -->
        <div class="absolute left-4 top-1/3 pointer-events-auto flex flex-col gap-2 z-20 glass-panel p-2 rounded-xl">
            <button onclick="setToolMode('select')" id="tool-select" class="futuristic-btn p-2 rounded bg-slate-800 text-xs flex flex-col items-center gap-1 active-tab border border-slate-600"><span class="text-base">👆</span> <span class="text-[7px] font-mono">SEL</span></button>
            <button onclick="setToolMode('move')" id="tool-move" class="futuristic-btn p-2 rounded bg-slate-800 text-xs flex flex-col items-center gap-1 border border-slate-600"><span class="text-base">✋</span> <span class="text-[7px] font-mono">MOVE</span></button>
        </div>

        <!-- Virtual Joystick (Mouse Ball) -->
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
            <div class="absolute -bottom-6 text-[9px] font-mono text-pink-400 opacity-80">PAN SCROLL</div>
        </div>

        <!-- Footer / Smart Dock -->
        <footer class="pointer-events-none p-4 w-full flex flex-col items-center justify-end z-30">
            
            <div id="dock-content" class="dock-drawer pointer-events-auto glass-panel w-full max-w-3xl p-4 rounded-t-3xl shadow-2xl mb-0 max-h-[38vh] overflow-hidden flex flex-col open">
                
                <!-- Tab 1: Theatre & Shapes Spawner -->
                <div id="tab-spawner" class="dock-tab-pane flex-1 overflow-y-auto h-full grid grid-cols-2 md:grid-cols-4 gap-2.5 pb-2">
                    <div class="col-span-full text-[10px] text-pink-400 font-mono mb-1">Paper Theatre Puppets & Assets</div>
                    <button onclick="spawnPaperPuppet('Rabbit Hero', '🐰')" class="p-2 bg-slate-800/80 rounded-xl border border-pink-500/30 hover:bg-pink-900/40 text-[10px] flex flex-col items-center gap-1"><span class="text-lg">🐰</span>Rabbit Puppet</button>
                    <button onclick="spawnPaperPuppet('Wizard Sage', '🧙‍♂️')" class="p-2 bg-slate-800/80 rounded-xl border border-indigo-500/30 hover:bg-indigo-900/40 text-[10px] flex flex-col items-center gap-1"><span class="text-lg">🧙‍♂️</span>Wizard Puppet</button>
                    <button onclick="spawnPaperPuppet('Mecha Android', '🤖')" class="p-2 bg-slate-800/80 rounded-xl border border-cyan-500/30 hover:bg-cyan-900/40 text-[10px] flex flex-col items-center gap-1"><span class="text-lg">🤖</span>Mecha Puppet</button>
                    <button onclick="spawnGlassyObject('box')" class="p-2 bg-slate-800/80 rounded-xl border border-purple-500/30 hover:bg-purple-900/40 text-[10px] flex flex-col items-center gap-1"><span class="text-lg">🧊</span>Stage Cube</button>
                    
                    <div class="col-span-full text-[10px] text-pink-400 font-mono mt-2 mb-1 border-t border-slate-700 pt-2">Suits & Quantum Gems</div>
                    <button onclick="spawnShape('gem')" class="p-2 bg-slate-800/80 rounded-xl border border-blue-500/30 hover:bg-blue-900/40 text-[10px] flex flex-col items-center gap-1"><span class="text-lg">💎</span>Diamond</button>
                    <button onclick="spawnShape('heart')" class="p-2 bg-slate-800/80 rounded-xl border border-red-500/30 hover:bg-red-900/40 text-[10px] flex flex-col items-center gap-1"><span class="text-lg text-red-500">♥️</span>Heart</button>
                    <button onclick="spawnShape('spade')" class="p-2 bg-slate-800/80 rounded-xl border border-slate-500/30 hover:bg-slate-700/40 text-[10px] flex flex-col items-center gap-1"><span class="text-lg">♠️</span>Spade</button>
                    <button onclick="spawnShape('club')" class="p-2 bg-slate-800/80 rounded-xl border border-green-500/30 hover:bg-green-900/40 text-[10px] flex flex-col items-center gap-1"><span class="text-lg text-green-500">♣️</span>Club</button>
                </div>

                <!-- Tab 2: Universal Upload Pipeline -->
                <div id="tab-upload" class="dock-tab-pane flex-1 overflow-y-auto h-full hidden flex flex-col items-center justify-center p-3">
                    <div class="text-center max-w-md mx-auto">
                        <div class="w-12 h-12 mx-auto mb-2 bg-gradient-to-tr from-pink-600 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg transform rotate-3">
                            <span class="text-xl -rotate-3">☁️</span>
                        </div>
                        <h3 class="font-bold text-slate-100 text-xs mb-1">Universal Theatre Pipeline</h3>
                        <p class="text-[9px] text-slate-400 mb-3 font-mono">Upload HTML, TXT, MP3, M4A, PNG, JPG, GLB, OBJ</p>
                        
                        <label class="relative inline-flex group cursor-pointer">
                            <input type="file" id="universal-upload" multiple class="hidden" onchange="handleUniversalUpload(event)">
                            <div class="px-5 py-2 bg-cyan-600 group-hover:bg-cyan-500 text-white rounded-xl font-bold text-xs shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all">
                                + Select Files to Stage
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Tab 3: Properties -->
                <div id="tab-properties" class="dock-tab-pane flex-1 overflow-y-auto h-full hidden">
                    <div id="no-selection-msg" class="text-xs text-slate-500 text-center py-6">Select a puppet or object on stage</div>
                    <div id="properties-content" class="hidden grid grid-cols-1 md:grid-cols-2 gap-3 pb-2">
                        <div class="space-y-2">
                            <div><label class="text-[9px] text-pink-300">Name</label><input type="text" id="prop-name" class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-xs text-white" onchange="updateSelectedName(this.value)"></div>
                            <div class="flex justify-between items-center"><label class="text-[10px] text-slate-300">Color</label><input type="color" id="prop-color" oninput="updateObjectProperty('color', this.value)" class="w-7 h-7 rounded cursor-pointer bg-transparent border-none p-0"></div>
                            <div>
                                <div class="flex justify-between"><label class="text-[10px] text-slate-300">Rainbow Emissive</label><span id="val-emission" class="text-[9px] text-cyan-300">0.0</span></div>
                                <input type="range" id="prop-emission" min="0" max="2" step="0.1" value="0" oninput="updateObjectProperty('emission', this.value)" class="w-full">
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[9px] text-pink-300 font-bold">Scale (X, Y, Z)</label>
                            <div class="flex gap-2">
                                <input type="number" id="prop-scale-x" step="0.1" onchange="updateObjectProperty('scaleX', this.value)" class="w-full bg-slate-800 text-[10px] p-1 rounded text-white text-center">
                                <input type="number" id="prop-scale-y" step="0.1" onchange="updateObjectProperty('scaleY', this.value)" class="w-full bg-slate-800 text-[10px] p-1 rounded text-white text-center">
                                <input type="number" id="prop-scale-z" step="0.1" onchange="updateObjectProperty('scaleZ', this.value)" class="w-full bg-slate-800 text-[10px] p-1 rounded text-white text-center">
                            </div>
                            <label class="text-[9px] text-pink-300 font-bold mt-1 block">Audio Synths & Rainbow Reflection</label>
                            <button id="prop-audio-react" onclick="toggleAudioReactivity()" class="w-full py-1.5 bg-slate-800 border border-slate-600 rounded text-[10px] text-slate-300 hover:border-pink-500 transition">Enable Audio Visualizer</button>
                            
                            <button onclick="deleteSelectedObject()" class="w-full py-1 mt-1 bg-red-900/30 hover:bg-red-800 border border-red-500/50 rounded text-red-300 text-[10px] font-bold transition">🗑️ Remove Asset</button>
                        </div>
                    </div>
                </div>

                <!-- Tab 4: Stage Inventory Graph -->
                <div id="tab-inventory" class="dock-tab-pane flex-1 overflow-y-auto h-full hidden">
                    <div class="flex justify-between items-center mb-2 border-b border-slate-700 pb-2">
                        <span class="text-[10px] font-mono text-cyan-300">STAGE INVENTORY</span>
                        <span class="text-[10px] text-slate-400">Total: <span id="inv-count">0</span></span>
                    </div>
                    <ul id="inventory-list" class="space-y-1"></ul>
                </div>
            </div>

            <!-- Dock Navigation Bar -->
            <nav class="pointer-events-auto glass-panel w-full max-w-3xl p-1 rounded-full shadow-[0_10px_40px_rgba(0,0,0,0.8)] flex justify-between items-center mt-2 relative z-40 bg-slate-900/90">
                <div class="flex gap-1 w-full justify-center">
                    <button onclick="openDockTab('spawner', this)" class="dock-btn active-tab futuristic-btn px-4 py-2.5 rounded-full text-[10px] font-bold text-slate-400 hover:text-white flex-1 max-w-[110px]">🎭 Puppets</button>
                    <button onclick="openDockTab('upload', this)" class="dock-btn futuristic-btn px-4 py-2.5 rounded-full text-[10px] font-bold text-slate-400 hover:text-white flex-1 max-w-[110px]">☁️ Upload</button>
                    <button onclick="openDockTab('properties', this)" id="nav-prop-btn" class="dock-btn futuristic-btn px-4 py-2.5 rounded-full text-[10px] font-bold text-slate-400 hover:text-white flex-1 max-w-[110px]">⚙️ Props</button>
                    <button onclick="openDockTab('inventory', this)" class="dock-btn futuristic-btn px-4 py-2.5 rounded-full text-[10px] font-bold text-slate-400 hover:text-white flex-1 max-w-[110px]">📋 Inventory</button>
                    <button onclick="toggleDock()" id="dock-toggle-btn" class="futuristic-btn px-3 py-2.5 rounded-full text-[10px] font-bold text-pink-400 hover:bg-pink-900/30 flex-1 max-w-[70px]">▼ CLOSE</button>
                </div>
            </nav>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div id="toast-container" class="absolute top-20 right-4 z-50 pointer-events-none flex flex-col gap-2"></div>

    <script>
        let scene, camera, renderer, orbitControls;
        let objects3D = []; 
        let activeTool = 'select';
        let selectedObject = null;
        let selectionBox = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        
        let isDockOpen = true;
        let isDragging = false;
        let dragOffset = new THREE.Vector3();
        let dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        
        let joyActive = false;
        let joyCenter = {x:0, y:0};
        let joyOffset = {x:0, y:0};

        let analyser, tonePlayer;
        let isAudioPlaying = false;
        let domCards = [];

        function initQuantumTheatre() {
            const container = document.getElementById('canvas-container');
            if(!container) return;
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            scene.fog = new THREE.FogExp2(0x020617, 0.012);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 14);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.05;
            orbitControls.target.set(0, 1.5, 0);
            orbitControls.maxDistance = 50;

            scene.add(new THREE.AmbientLight(0x332244, 1.5));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const pinkLight = new THREE.PointLight(0xec4899, 2.5, 25);
            pinkLight.position.set(-6, 6, 2);
            scene.add(pinkLight);
            
            const cyanLight = new THREE.PointLight(0x06b6d4, 2.5, 25);
            cyanLight.position.set(6, 6, 2);
            scene.add(cyanLight);

            const gridHelper = new THREE.GridHelper(50, 50, 0xec4899, 0x1e1b4b);
            gridHelper.position.y = 0;
            scene.add(gridHelper);
            
            selectionBox = new THREE.BoxHelper(new THREE.Mesh(new THREE.BoxGeometry(1,1,1)), 0x00FF66);
            selectionBox.visible = false;
            scene.add(selectionBox);

            createStarfield();
            spawnPaperPuppet("Lead Rabbit", "🐰");

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
            
            setupJoystick();
            openDockTab('spawner', document.querySelector('.dock-btn'));

            animate();
            updateInventory();
        }

        function createStarfield() {
            const starGeo = new THREE.BufferGeometry();
            const posArray = new Float32Array(2500 * 3);
            for(let i = 0; i < 7500; i++) posArray[i] = (Math.random() - 0.5) * 90;
            starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMat = new THREE.PointsMaterial({ size: 0.12, color: 0xa855f7, transparent: true, opacity: 0.8 });
            scene.add(new THREE.Points(starGeo, starMat));
        }

        function createStandardMaterial(colorHex, isGlass = false) {
            if(isGlass) {
                return new THREE.MeshPhysicalMaterial({
                    color: colorHex, metalness: 0.1, roughness: 0.1,
                    transmission: 0.85, opacity: 1, transparent: true,
                    thickness: 0.6, clearcoat: 1.0, emissive: 0x000000
                });
            }
            return new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4, metalness: 0.1 });
        }

        function spawnGlassyObject(type) {
            const group = new THREE.Group();
            group.position.set((Math.random()-0.5)*6, 2, (Math.random()-0.5)*6);
            group.userData = { type: type, name: `Stage Cube`, isAudioReactive: false };

            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = createStandardMaterial(0x8b5cf6, true);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true; mesh.receiveShadow = true;
            group.add(mesh);
            group.userData.mainMaterial = material;
            group.userData.mesh = mesh;

            finalizeSpawn(group);
        }

        function spawnShape(suit) {
            const group = new THREE.Group();
            group.position.set((Math.random()-0.5)*6, 2, (Math.random()-0.5)*6);
            
            let color = 0x00ffff, name = 'Quantum Diamond';
            if(suit === 'heart') { color = 0xff2255; name = 'Paper Heart'; }
            if(suit === 'spade') { color = 0x94a3b8; name = 'Paper Spade'; }
            if(suit === 'club') { color = 0x22c55e; name = 'Paper Club'; }
            
            group.userData = { type: 'shape', name: name, isAudioReactive: false };

            const shape = new THREE.Shape();
            const x = 0, y = 0;
            
            if(suit === 'heart') {
                shape.moveTo( x + 5, y + 5 );
                shape.bezierCurveTo( x + 5, y + 5, x + 4, y, x, y );
                shape.bezierCurveTo( x - 6, y, x - 6, y + 7,x - 6, y + 7 );
                shape.bezierCurveTo( x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19 );
                shape.bezierCurveTo( x + 12, y + 15.4, x + 16, y + 11, x + 16, y + 7 );
                shape.bezierCurveTo( x + 16, y + 7, x + 16, y, x + 10, y );
                shape.bezierCurveTo( x + 7, y, x + 5, y + 5, x + 5, y + 5 );
            } else {
                shape.moveTo(0, 10); shape.lineTo(6, 0); shape.lineTo(0, -10); shape.lineTo(-6, 0); shape.lineTo(0, 10);
            }

            const extrudeSettings = { depth: 2, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.5, bevelThickness: 0.5 };
            const geometry = new THREE.ExtrudeGeometry( shape, extrudeSettings );
            geometry.center();
            if(suit === 'heart') geometry.rotateZ(Math.PI);
            geometry.scale(0.08, 0.08, 0.08);

            const material = createStandardMaterial(color, false);
            material.emissive.setHex(color);
            material.emissiveIntensity = 0.3;

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            group.add(mesh);
            group.userData.mainMaterial = material;
            group.userData.mesh = mesh;

            finalizeSpawn(group);
        }

        function spawnPaperPuppet(name, emoji) {
            createPaperdollMesh(name, (Math.random()-0.5)*4, (Math.random()-0.5)*4, emoji);
        }

        function createPaperdollMesh(name, x, z, emoji, customImgUrl = null) {
            const group = new THREE.Group();
            group.position.set(x, 1.8, z);
            group.userData = { type: 'paperdoll', name: name, isPaperdoll: true };

            const geometry = new THREE.PlaneGeometry(2.4, 3.4);
            let material;

            if (customImgUrl) {
                const texture = new THREE.TextureLoader().load(customImgUrl);
                material = new THREE.MeshStandardMaterial({ map: texture, transparent: true, side: THREE.DoubleSide, roughness: 0.2 });
            } else {
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 356;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#1e1b4b'; ctx.roundRect(10, 10, 236, 336, 24); ctx.fill();
                ctx.strokeStyle = '#ec4899'; ctx.lineWidth = 4; ctx.stroke();
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px Inter'; ctx.textAlign = 'center';
                ctx.fillText(name, 128, 55); ctx.font = '75px sans-serif'; ctx.fillText(emoji, 128, 190);
                material = new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, side: THREE.DoubleSide });
            }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true; group.add(mesh);
            group.userData.mainMaterial = material; group.userData.mesh = mesh;

            const stageRing = new THREE.TorusGeometry(1.4, 0.04, 16, 50);
            const ring = new THREE.Mesh(stageRing, new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true }));
            ring.rotation.x = Math.PI / 2; ring.position.y = -1.7;
            group.add(ring);

            finalizeSpawn(group);
        }

        function finalizeSpawn(group) {
            scene.add(group);
            objects3D.push(group);
            selectObject(group);
            updateInventory();
            showToast(`Staged Puppet/Asset: ${group.userData.name}`);
        }

        function getIntersects(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            let meshes = [];
            objects3D.forEach(g => g.children.forEach(c => { if(c.isMesh && !c.material.wireframe) meshes.push(c); }));
            return raycaster.intersectObjects(meshes);
        }

        function onPointerDown(e) {
            if(!renderer || e.target !== renderer.domElement) return;

            const intersects = getIntersects(e);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const parentGroup = hit.object.parent;
                orbitControls.enabled = false; 

                if (activeTool === 'select') {
                    selectObject(parentGroup);
                } 
                else if (activeTool === 'move') {
                    selectObject(parentGroup);
                    isDragging = true;
                    raycaster.ray.intersectPlane(dragPlane, dragOffset);
                    dragOffset.sub(parentGroup.position);
                }
            } else {
                if(!isDragging) {
                    selectedObject = null;
                    if(selectionBox) selectionBox.visible = false;
                    updatePropertiesUI();
                    if(orbitControls) orbitControls.enabled = true;
                }
            }
        }

        function onPointerMove(e) {
            if (isDragging && selectedObject && activeTool === 'move') {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                let intersectPoint = new THREE.Vector3();
                raycaster.ray.intersectPlane(dragPlane, intersectPoint);
                if(intersectPoint) {
                    selectedObject.position.copy(intersectPoint.sub(dragOffset));
                    if(selectionBox) selectionBox.setFromObject(selectedObject);
                }
            }
        }

        function onPointerUp(e) {
            isDragging = false;
            if(orbitControls) orbitControls.enabled = true; 
        }

        function selectObject(group) {
            selectedObject = group;
            if(selectionBox) {
                selectionBox.setFromObject(group);
                selectionBox.visible = true;
            }
            updatePropertiesUI();
            
            const propTab = document.getElementById('tab-properties');
            const propNavBtn = document.getElementById('nav-prop-btn');
            if(propTab && propTab.classList.contains('hidden') && propNavBtn) {
                openDockTab('properties', propNavBtn);
            }
            if(!isDockOpen) toggleDock();
        }

        function setToolMode(mode) {
            activeTool = mode;
            const selTool = document.getElementById('tool-select');
            const movTool = document.getElementById('tool-move');
            if(selTool) selTool.classList.toggle('active-tab', mode === 'select');
            if(movTool) movTool.classList.toggle('active-tab', mode === 'move');
        }

        function updatePropertiesUI() {
            const noSelMsg = document.getElementById('no-selection-msg');
            const propContent = document.getElementById('properties-content');
            if(!noSelMsg || !propContent) return;

            if (!selectedObject) {
                noSelMsg.classList.remove('hidden');
                propContent.classList.add('hidden');
                return;
            }
            
            noSelMsg.classList.add('hidden');
            propContent.classList.remove('hidden');
            
            const propName = document.getElementById('prop-name');
            if(propName) propName.value = selectedObject.userData.name;
            
            if (selectedObject.userData.mainMaterial) {
                const mat = selectedObject.userData.mainMaterial;
                const propColor = document.getElementById('prop-color');
                const propEmission = document.getElementById('prop-emission');
                const valEmission = document.getElementById('val-emission');
                
                if(propColor && mat.color) propColor.value = '#' + mat.color.getHexString();
                if(propEmission) propEmission.value = mat.emissiveIntensity || 0;
                if(valEmission) valEmission.innerText = (mat.emissiveIntensity || 0).toFixed(1);
            }

            const sx = document.getElementById('prop-scale-x');
            const sy = document.getElementById('prop-scale-y');
            const sz = document.getElementById('prop-scale-z');
            if(sx) sx.value = selectedObject.scale.x.toFixed(1);
            if(sy) sy.value = selectedObject.scale.y.toFixed(1);
            if(sz) sz.value = selectedObject.scale.z.toFixed(1);

            const arBtn = document.getElementById('prop-audio-react');
            if(arBtn) {
                if(selectedObject.userData.isAudioReactive) {
                    arBtn.classList.add('bg-pink-600', 'text-white', 'border-pink-400');
                    arBtn.innerText = "Audio Reactive: ON";
                } else {
                    arBtn.classList.remove('bg-pink-600', 'text-white', 'border-pink-400');
                    arBtn.innerText = "Enable Audio Visualizer";
                }
            }
        }

        function updateObjectProperty(prop, value) {
            if(!selectedObject) return;
            const mat = selectedObject.userData.mainMaterial;
            const val = parseFloat(value);

            switch(prop) {
                case 'color': if(mat) { mat.color.set(value); if(mat.emissive) mat.emissive.set(value); } break;
                case 'emission':
                    if(mat) {
                        mat.emissiveIntensity = val;
                        const valEmission = document.getElementById('val-emission');
                        if(valEmission) valEmission.innerText = val.toFixed(1);
                    }
                    break;
                case 'scaleX': selectedObject.scale.x = val; break;
                case 'scaleY': selectedObject.scale.y = val; break;
                case 'scaleZ': selectedObject.scale.z = val; break;
            }
            if(selectionBox) selectionBox.setFromObject(selectedObject);
        }

        function updateSelectedName(val) {
            if(selectedObject) {
                selectedObject.userData.name = val;
                updateInventory();
            }
        }

        function toggleAudioReactivity() {
            if(!selectedObject) return;
            selectedObject.userData.isAudioReactive = !selectedObject.userData.isAudioReactive;
            
            const uiLayer = document.getElementById('ui-layer');
            if(selectedObject.userData.isAudioReactive) {
                if(!Tone.context || Tone.context.state !== 'running') {
                    showToast("Tip: Upload an MP3/M4A file in the Upload tab to trigger synth reactions!");
                }
                if(uiLayer) uiLayer.classList.add('audio-reactive-ui');
            } else {
                const anyReactive = objects3D.some(o => o.userData.isAudioReactive);
                if(!anyReactive && uiLayer) uiLayer.classList.remove('audio-reactive-ui');
            }
            updatePropertiesUI();
        }

        function deleteSelectedObject() {
            if(!selectedObject) return;
            scene.remove(selectedObject);
            domCards = domCards.filter(c => {
                if(c.obj === selectedObject) { c.el.remove(); return false; }
                return true;
            });
            objects3D = objects3D.filter(o => o !== selectedObject);
            selectedObject = null;
            if(selectionBox) selectionBox.visible = false;
            updatePropertiesUI();
            updateInventory();
            showToast("Asset removed from stage.");
        }

        function toggleDock() {
            isDockOpen = !isDockOpen;
            const dock = document.getElementById('dock-content');
            const btn = document.getElementById('dock-toggle-btn');
            if(!dock || !btn) return;
            
            if(isDockOpen) {
                dock.classList.add('open');
                btn.innerText = "▼ CLOSE";
            } else {
                dock.classList.remove('open');
                btn.innerText = "▲ OPEN";
            }
        }

        function openDockTab(tabId, btnElement) {
            if(!isDockOpen) toggleDock();
            
            document.querySelectorAll('.dock-tab-pane').forEach(el => el.classList.add('hidden'));
            const targetTab = document.getElementById(`tab-${tabId}`);
            if(targetTab) targetTab.classList.remove('hidden');
            
            document.querySelectorAll('.dock-btn').forEach(el => el.classList.remove('active-tab'));
            if(btnElement) btnElement.classList.add('active-tab');
        }

        function updateInventory() {
            const list = document.getElementById('inventory-list');
            const countEl = document.getElementById('inv-count');
            if(!list || !countEl) return;
            
            list.innerHTML = '';
            countEl.innerText = objects3D.length;
            
            objects3D.forEach((obj) => {
                const li = document.createElement('li');
                li.className = "p-2 bg-slate-800 rounded flex justify-between items-center cursor-pointer hover:bg-slate-700 transition";
                li.onclick = () => selectObject(obj);
                
                const isSel = (obj === selectedObject);
                if(isSel) li.classList.add('border', 'border-pink-500');

                let icon = '📦';
                if(obj.userData.type === 'paperdoll') icon = '🎭';
                else if(obj.userData.type === 'shape') icon = '💎';

                li.innerHTML = `
                    <span class="text-xs font-mono truncate text-slate-300"><span class="mr-2">${icon}</span>${obj.userData.name}</span>
                    ${obj.userData.isAudioReactive ? '<span class="text-[10px] text-pink-400">♫</span>' : ''}
                `;
                list.appendChild(li);
            });
        }

        async function handleUniversalUpload(event) {
            const files = event.target.files;
            if(!files || files.length === 0) return;

            for(let file of files) {
                const ext = file.name.split('.').pop().toLowerCase();
                const url = URL.createObjectURL(file);
                
                showToast(`Loading: ${file.name}...`);

                if(['png', 'jpg', 'jpeg', 'gif'].includes(ext)) {
                    createPaperdollMesh(file.name, (Math.random()-0.5)*4, (Math.random()-0.5)*4, "🖼️", url);
                }
                else if(['mp3', 'm4a', 'wav'].includes(ext)) {
                    setupAudioVisualizer(url, file.name);
                }
                else if(['txt', 'html', 'htm'].includes(ext)) {
                    const text = await file.text();
                    createDOMCardAnchor(file.name, text, ext === 'html');
                }
                else if(['glb', 'gltf'].includes(ext)) {
                    if(typeof THREE.GLTFLoader !== 'undefined') {
                        const loader = new THREE.GLTFLoader();
                        loader.load(url, (gltf) => {
                            const model = gltf.scene;
                            model.position.set(0, 0, 0);
                            const box = new THREE.Box3().setFromObject(model);
                            const center = box.getCenter(new THREE.Vector3());
                            model.position.sub(center);
                            
                            const wrapper = new THREE.Group();
                            wrapper.add(model);
                            wrapper.position.set((Math.random()-0.5)*4, 1.5, (Math.random()-0.5)*4);
                            wrapper.userData = { type: 'file-3d', name: file.name, isAudioReactive: false };
                            
                            model.traverse((child) => {
                                if(child.isMesh) {
                                    child.castShadow = true;
                                    if(!wrapper.userData.mainMaterial) wrapper.userData.mainMaterial = child.material;
                                }
                            });
                            
                            finalizeSpawn(wrapper);
                        });
                    }
                }
                else if (ext === 'obj') {
                    if(typeof THREE.OBJLoader !== 'undefined') {
                        const loader = new THREE.OBJLoader();
                        loader.load(url, (obj) => {
                            const material = createStandardMaterial(0xcccccc, false);
                            obj.traverse((child) => { if(child.isMesh) child.material = material; });
                            
                            const box = new THREE.Box3().setFromObject(obj);
                            const center = box.getCenter(new THREE.Vector3());
                            obj.position.sub(center);
                            
                            const wrapper = new THREE.Group();
                            wrapper.add(obj);
                            wrapper.position.set((Math.random()-0.5)*4, 1.5, (Math.random()-0.5)*4);
                            wrapper.userData = { type: 'file-3d', name: file.name, isAudioReactive: false, mainMaterial: material };
                            
                            finalizeSpawn(wrapper);
                        });
                    }
                } else {
                    const text = await file.text();
                    createDOMCardAnchor(file.name, text, false);
                }
            }
            event.target.value = '';
        }

        async function setupAudioVisualizer(url, name) {
            if(typeof Tone === 'undefined') return;
            if(!Tone.context) await Tone.start();
            
            if(tonePlayer) { tonePlayer.stop(); tonePlayer.dispose(); }
            
            analyser = new Tone.Analyser("fft", 64);
            tonePlayer = new Tone.Player(url).connect(analyser).toDestination();
            tonePlayer.autostart = true;
            tonePlayer.loop = true;
            
            const audioStatus = document.getElementById('audio-status');
            if(audioStatus) audioStatus.innerHTML = `Audio: <strong class="text-pink-400 font-bold animate-pulse">Playing (${name})</strong>`;
            showToast(`Audio Synth pipeline active!`);
            isAudioPlaying = true;
        }

        function createDOMCardAnchor(name, content, isHTML) {
            const group = new THREE.Group();
            group.position.set((Math.random()-0.5)*4, 3, (Math.random()-0.5)*4);
            group.userData = { type: 'file-html', name: name, isAudioReactive: false };
            
            const geo = new THREE.PlaneGeometry(1.5, 2);
            const mat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true, transparent: true, opacity: 0.3 });
            const mesh = new THREE.Mesh(geo, mat);
            group.add(mesh);
            
            finalizeSpawn(group);

            const container = document.getElementById('dom-anchors-container');
            if(!container) return;
            
            const card = document.createElement('div');
            card.className = 'dom-card';
            
            const header = document.createElement('div');
            header.className = 'border-b border-cyan-500/30 pb-2 mb-2 font-mono text-cyan-300 font-bold truncate flex justify-between';
            header.innerHTML = `<span>📄 ${name}</span> <span class="text-[8px] text-slate-400">(Scrollable)</span>`;
            
            const body = document.createElement('div');
            if(isHTML) {
                body.innerHTML = content;
            } else {
                body.innerHTML = `<pre class="whitespace-pre-wrap font-mono text-[10px] text-slate-300">${content}</pre>`;
            }

            card.appendChild(header);
            card.appendChild(body);
            
            card.addEventListener('wheel', e => e.stopPropagation());
            card.addEventListener('pointerdown', e => e.stopPropagation());
            card.addEventListener('pointermove', e => e.stopPropagation());
            
            container.appendChild(card);
            domCards.push({ el: card, obj: group });
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            if(!zone || !knob) return;
            
            const handleStart = (e) => {
                e.preventDefault();
                joyActive = true;
                const rect = zone.getBoundingClientRect();
                joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
                updateJoy(e.clientX || e.touches[0].clientX, e.clientY || e.touches[0].clientY);
            };
            
            const handleMove = (e) => {
                if(!joyActive) return;
                e.preventDefault();
                updateJoy(e.clientX || e.touches[0].clientX, e.clientY || e.touches[0].clientY);
            };
            
            const handleEnd = () => {
                joyActive = false;
                joyOffset = {x:0, y:0};
                knob.style.transform = `translate(-50%, -50%)`;
            };
            
            const updateJoy = (clientX, clientY) => {
                let dx = clientX - joyCenter.x;
                let dy = clientY - joyCenter.y;
                const maxDist = 36;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist > maxDist) {
                    dx = (dx/dist) * maxDist;
                    dy = (dy/dist) * maxDist;
                }
                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                joyOffset = { x: dx/maxDist, y: dy/maxDist };
            };

            zone.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);
            
            zone.addEventListener('touchstart', handleStart, {passive: false});
            window.addEventListener('touchmove', handleMove, {passive: false});
            window.addEventListener('touchend', handleEnd);
        }

        function updateDOMAnchors() {
            domCards.forEach(card => {
                const vector = card.obj.position.clone();
                vector.project(camera);
                
                const x = (vector.x * .5 + .5) * window.innerWidth;
                const y = (vector.y * -.5 + .5) * window.innerHeight;
                
                if(vector.z > 1) {
                    card.el.style.opacity = '0';
                } else {
                    card.el.style.opacity = '1';
                    card.el.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            if(joyActive && camera && orbitControls) {
                const moveSpeed = 0.2;
                const forward = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize();
                const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
                right.y = 0; right.normalize();
                
                const moveVec = forward.multiplyScalar(-joyOffset.y * moveSpeed).add(right.multiplyScalar(joyOffset.x * moveSpeed));
                camera.position.add(moveVec);
                orbitControls.target.add(moveVec);
            }

            if(orbitControls) orbitControls.update();

            let audioValues = null;
            if(isAudioPlaying && analyser) {
                audioValues = analyser.getValue();
            }

            objects3D.forEach((grp, i) => {
                if(grp.userData.isPaperdoll || grp.userData.type === 'file-html') {
                    if(camera) grp.quaternion.copy(camera.quaternion);
                }

                if(grp.userData.isAudioReactive && audioValues && grp.userData.mainMaterial) {
                    const bandIndex = Math.floor((i / objects3D.length) * audioValues.length);
                    let intensity = (audioValues[bandIndex] + 100) / 100;
                    intensity = Math.max(0, Math.min(1, intensity));

                    const baseScale = 1.0;
                    const bounce = intensity * 1.4;
                    grp.scale.set(baseScale + bounce, baseScale + bounce, baseScale + bounce);
                    
                    if(grp.userData.mainMaterial.emissive) {
                        const hue = (time * 0.4 + i * 0.15) % 1;
                        grp.userData.mainMaterial.emissive.setHSL(hue, 1, intensity * 2);
                        grp.userData.mainMaterial.emissiveIntensity = intensity * 3;
                    }
                } else if (grp.userData.isAudioReactive) {
                     if(grp.userData.mainMaterial && grp.userData.mainMaterial.emissive) {
                        const hue = (time * 0.2 + i * 0.1) % 1;
                        grp.userData.mainMaterial.emissive.setHSL(hue, 1, 0.5);
                     }
                }
            });

            if(selectionBox && selectedObject) selectionBox.update();
            updateDOMAnchors();
            if(renderer && scene && camera) renderer.render(scene, camera);
        }

        function onWindowResize() {
            if(!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = 'glass-panel px-4 py-2 rounded-xl text-xs text-pink-300 font-mono shadow-lg border border-pink-500/40 animate-pulse';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        document.body.addEventListener('click', async () => {
            if(typeof Tone !== 'undefined' && Tone.context && Tone.context.state !== 'running') {
                await Tone.start();
            }
        }, { once: true });
    </script>
</body>
